
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract PDF Pages - PDFMaster</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    .extract-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }
    .extract-header { text-align: center; margin-bottom: 28px; }
    .upload-area {
      border: 2px dashed #8b8b9b;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      margin: 20px 0;
    }
    .upload-area:hover { background: #f5f7ff; }
    .page-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .page-option {
      border: 1px solid #d5d8e0;
      border-radius: 10px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
    }
    .page-option:has(input:checked) {
      border: 2px solid #5146e5;
      background: #f0efff;
    }
    .page-option input { margin-right: 5px; }
    .action-button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      font-weight: 600;
    }
    .primary-button { background: #5146e5; color: white; }
    .secondary-button { background: #e9eaf0; color: #222; }
    .action-button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin: 18px 0; overflow-wrap: anywhere; }
    .privacy-note { font-size: .9rem; color: #626575; }
  </style>
</head>
<body>
  <main class="extract-container">
    <header class="extract-header">
      <h1>Extract PDF Pages</h1>
      <p>Select the pages you want and save them as a new PDF.</p>
      <p class="privacy-note">Your PDF is processed in your browser by this tool.</p>
    </header>

    <section class="upload-area" id="uploadArea" tabindex="0" role="button"
      aria-label="Choose a PDF file">
      <h2>📄 Choose a PDF file</h2>
      <p>Click here or drag your PDF into this area</p>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
    </section>

    <p id="fileInfo">No PDF selected yet.</p>

    <section id="pageSection" hidden>
      <h2>Select pages to extract</h2>
      <p id="pageInfo"></p>
      <button type="button" class="action-button secondary-button" id="selectAll">
        Select all
      </button>
      <button type="button" class="action-button secondary-button" id="clearAll">
        Clear selection
      </button>

      <div class="page-list" id="pageList"></div>

      <button type="button" class="action-button primary-button" id="extractButton" disabled>
        Extract Selected Pages
      </button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="../index.html">← Back to PDFMaster</a></p>
  </main>

  <script>
    const pdfInput = document.getElementById("pdfInput");
    const uploadArea = document.getElementById("uploadArea");
    const fileInfo = document.getElementById("fileInfo");
    const pageSection = document.getElementById("pageSection");
    const pageList = document.getElementById("pageList");
    const pageInfo = document.getElementById("pageInfo");
    const status = document.getElementById("status");
    const extractButton = document.getElementById("extractButton");

    let sourceBytes = null;
    let sourceName = "document.pdf";
    let totalPages = 0;

    uploadArea.addEventListener("click", () => pdfInput.click());
    uploadArea.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        pdfInput.click();
      }
    });

    pdfInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) loadPDF(file);
    });

    uploadArea.addEventListener("dragover", event => {
      event.preventDefault();
      uploadArea.style.background = "#f0efff";
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.style.background = "";
    });

    uploadArea.addEventListener("drop", event => {
      event.preventDefault();
      uploadArea.style.background = "";
      const file = event.dataTransfer.files[0];
      if (file) loadPDF(file);
    });

    async function loadPDF(file) {
      status.textContent = "";
      pageSection.hidden = true;
      pageList.replaceChildren();
      extractButton.disabled = true;
      sourceBytes = null;

      if (!file.name.toLowerCase().endsWith(".pdf") &&
          file.type !== "application/pdf") {
        status.textContent = "Please choose a PDF file.";
        return;
      }

      if (file.size > 100 * 1024 * 1024) {
        status.textContent = "This file is larger than 100 MB. Please choose a smaller PDF.";
        return;
      }

      if (file.size === 0) {
        status.textContent = "The selected file is empty.";
        return;
      }

      try {
        status.textContent = "Reading PDF...";
        sourceBytes = new Uint8Array(await file.arrayBuffer());

        const pdf = await PDFLib.PDFDocument.load(sourceBytes);
        totalPages = pdf.getPageCount();
        sourceName = file.name;

        if (totalPages < 1) {
          throw new Error("This PDF contains no pages.");
        }

        fileInfo.textContent = `${file.name} — ${totalPages} page(s)`;
        pageInfo.textContent = `Choose one or more pages from this ${totalPages}-page PDF.`;
        pageList.replaceChildren();

        for (let i = 0; i < totalPages; i++) {
          const label = document.createElement("label");
          label.className = "page-option";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = i;
          checkbox.checked = true;
          checkbox.addEventListener("change", updateSelection);

          label.append(checkbox, document.createTextNode(` Page ${i + 1}`));
          pageList.appendChild(label);
        }

        pageSection.hidden = false;
        updateSelection();
        status.textContent = "PDF ready. Select the pages you want to extract.";
      } catch (error) {
        sourceBytes = null;
        fileInfo.textContent = "No PDF loaded.";
        status.textContent =
          "Could not open this PDF. It may be damaged or password-protected. Please try another PDF.";
        console.error(error);
      }
    }

    function updateSelection() {
      const selected = pageList.querySelectorAll("input:checked").length;
      extractButton.disabled = !sourceBytes || selected === 0;
      extractButton.textContent = selected
        ? `Extract ${selected} Selected Page(s)`
        : "Extract Selected Pages";
    }

    document.getElementById("selectAll").addEventListener("click", () => {
      pageList.querySelectorAll("input").forEach(input => input.checked = true);
      updateSelection();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      pageList.querySelectorAll("input").forEach(input => input.checked = false);
      updateSelection();
    });

    extractButton.addEventListener("click", async () => {
      if (!sourceBytes) return;

      const selectedIndexes = Array.from(
        pageList.querySelectorAll("input:checked")
      ).map(input => Number(input.value));

      if (selectedIndexes.length === 0) {
        status.textContent = "Select at least one page first.";
        return;
      }

      extractButton.disabled = true;
      status.textContent = "Extracting pages...";

      try {
        const originalPDF = await PDFLib.PDFDocument.load(sourceBytes);
        const newPDF = await PDFLib.PDFDocument.create();
        const copiedPages = await newPDF.copyPages(originalPDF, selectedIndexes);

        copiedPages.forEach(page => newPDF.addPage(page));

        const outputBytes = await newPDF.save();
        const blob = new Blob([outputBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        const baseName = sourceName.replace(/\.pdf$/i, "");
        link.href = url;
        link.download = `${baseName}-extracted-pages.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = `Success! Extracted ${selectedIndexes.length} page(s). Your download should begin shortly.`;
      } catch (error) {
        console.error(error);
        status.textContent = "Extraction failed. Please try another PDF.";
      } finally {
        updateSelection();
      }
    });
  </script>
</body>
</html>
